[package]
name = "netstack-smoltcp"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["alloc", "std"]}
futures-timer = "3.0.4"
smoltcp = "0.14.0"  

[dev-dependencies]
socket2 = "0.6.5"
tokio-util = { version = "0.7", features = ["compat"] }
tun2 = { version = "3", features = ["async"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
